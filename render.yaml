# Render.com deployment config
# Xem hướng dẫn: https://render.com/docs/deploy-flask

services:
  - type: web
    name: toancuathayem
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --timeout 180 --workers 2
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # Nhập thủ công trên Render dashboard
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
    plan: free
